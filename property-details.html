<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Details & Gallery | Maadi Nile View</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; line-height: 1.6; }
        header { background: #1e293b; border-bottom: 1px solid #334155; padding: 2rem 1rem; text-align: center; }
        header h1 { font-size: 2.5rem; color: #f59e0b; margin-bottom: 0.5rem; }
        header p { color: #94a3b8; font-size: 1.1rem; max-width: 700px; margin: 0 auto 1.5rem; }
        .nav-links { display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap; }
        .nav-btn { background: #334155; color: #f8fafc; text-decoration: none; padding: 0.5rem 1.2rem; border-radius: 6px; font-size: 0.9rem; font-weight: 500; transition: background 0.2s; }
        .nav-btn:hover { background: #475569; }
        .container { max-width: 1100px; margin: 3rem auto; padding: 0 1.5rem; }
        section { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 2.5rem; margin-bottom: 2rem; }
        h2 { font-size: 1.8rem; color: #f59e0b; margin-bottom: 1.2rem; }
        h3 { font-size: 1.3rem; color: #e2e8f0; margin: 1.5rem 0 0.8rem; }
        
        /* GALLERY STYLES */
        .category-title { font-size: 1.2rem; color: #38bdf8; margin: 1.5rem 0 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
        .gallery-item { aspect-ratio: 4/3; background: #0f172a; border-radius: 8px; overflow: hidden; border: 1px solid #334155; cursor: pointer; }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease; }
        .gallery-item:hover img { transform: scale(1.05); }

        /* LIGHTBOX */
        .lightbox { display: none; position: fixed; z-index: 1000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; }
        .lightbox.active { display: flex; }
        .lightbox img { max-width: 90%; max-height: 85vh; border-radius: 8px; border: 1px solid #334155; }
        .lightbox-close { position: absolute; top: 20px; right: 30px; font-size: 2rem; color: #fff; cursor: pointer; }

        footer { background: #0b1120; text-align: center; padding: 2.5rem; color: #64748b; font-size: 0.9rem; border-top: 1px solid #1e293b; }
    </style>
</head>
<body>

    <header>
        <h1>Property Details & Gallery</h1>
        <p>Explore full specifications, room layouts, and high-resolution photo galleries for Maadi Nile View.</p>
        <div class="nav-links">
            <a href="index.html" class="nav-btn">&larr; Back to Home</a>
            <a href="experiences.html" class="nav-btn">Tours & Experiences</a>
        </div>
    </header>

    <div class="container">

        <!-- PROPERTY GALLERY SECTION -->
        <section>
            <h2>Full Property Gallery</h2>

            <div class="category-title">Living & Dining Area</div>
            <div class="gallery-grid">
                <div class="gallery-item" onclick="openLightbox(this)"><img src="living_dining_area/1.jpg" alt="Living Room View" loading="lazy"></div>
                <div class="gallery-item" onclick="openLightbox(this)"><img src="living_dining_area/2.jpg" alt="Dining Table" loading="lazy"></div>
            </div>

            <div class="category-title">Sitting Area</div>
            <div class="gallery-grid">
                <div class="gallery-item" onclick="openLightbox(this)"><img src="sitting_area/1.jpg" alt="Sitting Area" loading="lazy"></div>
            </div>

            <div class="category-title">Master Bedroom & Bathroom</div>
            <div class="gallery-grid">
                <div class="gallery-item" onclick="openLightbox(this)"><img src="master_bedroom/1.jpg" alt="Master Bedroom King Bed" loading="lazy"></div>
                <div class="gallery-item" onclick="openLightbox(this)"><img src="master_bathroom/1.jpg" alt="Master Bathroom Walk-In Shower" loading="lazy"></div>
            </div>

            <div class="category-title">Bedrooms</div>
            <div class="gallery-grid">
                <div class="gallery-item" onclick="openLightbox(this)"><img src="left_bedroom/1.jpg" alt="Left Bedroom" loading="lazy"></div>
                <div class="gallery-item" onclick="openLightbox(this)"><img src="right_bedroom/1.jpg" alt="Right Bedroom" loading="lazy"></div>
            </div>

            <div class="category-title">Kitchen & Floor Plan</div>
            <div class="gallery-grid">
                <div class="gallery-item" onclick="openLightbox(this)"><img src="kitchen/1.jpg" alt="Kitchen Layout" loading="lazy"></div>
                <div class="gallery-item" onclick="openLightbox(this)"><img src="floor_plan/1.jpg" alt="Apartment Floor Plan" loading="lazy"></div>
                <div class="gallery-item" onclick="openLightbox(this)"><img src="rear_balcony/1.jpg" alt="Balcony View" loading="lazy"></div>
            </div>
        </section>

    </div>

    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <span class="lightbox-close">&times;</span>
        <img id="lightbox-img" src="" alt="Enlarged View">
    </div>

    <script>
        function openLightbox(element) {
            const src = element.querySelector('img').src;
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox').classList.add('active');
        }
        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
        }
    </script>

</body>
</html>
