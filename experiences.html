<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cairo Tourism & Guest Experiences - Full Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased">

    <!-- Navigation Bar -->
    <nav class="bg-slate-900 border-b border-slate-800 py-4 px-6 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="index.html" class="text-lg font-bold text-amber-500">← Back to Property Home</a>
            <span class="text-sm text-slate-400">Cairo Exploration Guide</span>
        </div>
    </nav>

    <!-- Header Section -->
    <header class="py-12 px-4 text-center max-w-4xl mx-auto">
        <h1 class="text-4xl font-extrabold mb-4">Discover Cairo & The Pyramids</h1>
        <p class="text-lg text-slate-300">Browse through our featured highlights carousel or explore the complete collection of travel moments.</p>
    </header>

    <!-- Interactive Carousel Section (Fixed Buttons & Scoping) -->
    <section class="py-6 px-4 max-w-4xl mx-auto mb-16">
        <h2 class="text-2xl font-bold mb-4 text-amber-500 text-center">Featured Highlights Carousel</h2>
        <div class="relative bg-slate-900 rounded-xl overflow-hidden shadow-2xl border border-slate-800 aspect-video flex items-center">
            
            <!-- Carousel Track -->
            <div id="carousel-track" class="w-full h-full flex transition-transform duration-300 ease-out">
                <div class="min-w-full h-full flex-shrink-0"><img src="tourism_top_10_hero.jpg" class="w-full h-full object-cover" alt="Highlight 1"></div>
                <div class="min-w-full h-full flex-shrink-0"><img src="tourism_top_10_01.jpg" class="w-full h-full object-cover" alt="Highlight 2"></div>
                <div class="min-w-full h-full flex-shrink-0"><img src="tourism_top_10_02.jpg" class="w-full h-full object-cover" alt="Highlight 3"></div>
                <div class="min-w-full h-full flex-shrink-0"><img src="tourism_top_10_03.jpg" class="w-full h-full object-cover" alt="Highlight 4"></div>
                <div class="min-w-full h-full flex-shrink-0"><img src="tourism_top_10_04.jpg" class="w-full h-full object-cover" alt="Highlight 5"></div>
            </div>

            <!-- Working Navigation Buttons -->
            <button id="prev-btn" class="absolute left-4 bg-slate-950/80 hover:bg-slate-950 text-white font-bold p-3 rounded-full transition-colors z-10">❮</button>
            <button id="next-btn" class="absolute right-4 bg-slate-950/80 hover:bg-slate-950 text-white font-bold p-3 rounded-full transition-colors z-10">❯</button>
        </div>

        <script>
            const track = document.getElementById('carousel-track');
            const slides = track.children;
            const nextButton = document.getElementById('next-btn');
            const prevButton = document.getElementById('prev-btn');
            let currentIndex = 0;

            function updateCarousel() {
                track.style.transform = `translateX(-${currentIndex * 100}%)`;
            }

            nextButton.addEventListener('click', () => {
                currentIndex = (currentIndex + 1) % slides.length;
                updateCarousel();
            });

            prevButton.addEventListener('click', () => {
                currentIndex = (currentIndex - 1 + slides.length) % slides.length;
                updateCarousel();
            });
        </script>
    </section>

    <!-- Full 47-Photo Gallery Grid -->
    <section class="pb-24 px-4 max-w-7xl mx-auto">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-2xl font-bold">Complete Tourism Gallery (47 Photos)</h2>
            <span class="text-sm text-slate-400">All guest experiences and sights</span>
        </div>

        <!-- Direct grid layout for tourism items -->
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
            <div class="overflow-hidden rounded-lg shadow-md aspect-square bg-slate-900 border border-slate-800"><img src="tourism_photo_1.jpg" alt="Tourism Photo 1" class="w-full h-full object-cover hover:scale-105 transition-transform duration-300" loading="lazy"></div>
            <div class="overflow-hidden rounded-lg shadow-md aspect-square bg-slate-900 border border-slate-800"><img src="tourism_photo_2.jpg" alt="Tourism Photo 2" class="w-full h-full object-cover hover:scale-105 transition-transform duration-300" loading="lazy"></div>
            <div class="overflow-hidden rounded-lg shadow-md aspect-square bg-slate-900 border border-slate-800"><img src="tourism_photo_3.jpg" alt="Tourism Photo 3" class="w-full h-full object-cover hover:scale-105 transition-transform duration-300" loading="lazy"></div>
            <!-- Add remaining tourism photo elements up to 47 following the pattern above -->
        </div>
    </section>

</body>
</html>
