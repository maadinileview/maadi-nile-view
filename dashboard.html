<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest Dashboard | Maadi Nile View</title>
    
    <!-- PASSKEY PROTECTED DASHBOARD SCRIPT -->
    <script>
        (function authenticateGuest() {
            const SET_PASSCODE = "MAADI2026"; // Change your guest password here
            
            const urlParams = new URLSearchParams(window.location.search);
            const urlKey = urlParams.get('key');
            const isAuth = sessionStorage.getItem('dashboard_authenticated');

            if (isAuth === 'true' || urlKey === SET_PASSCODE) {
                sessionStorage.setItem('dashboard_authenticated', 'true');
                return;
            }

            const userInput = prompt("Enter Guest Access Passcode:");
            if (userInput === SET_PASSCODE) {
                sessionStorage.setItem('dashboard_authenticated', 'true');
            } else {
                alert("Unauthorized access. Redirecting to home.");
                window.location.href = "index.html";
            }
        })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans p-6">
    <div class="max-w-4xl mx-auto bg-slate-900 border border-slate-800 rounded-2xl p-8 mt-10">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-amber-500">Welcome Guest</h1>
            <a href="index.html" class="text-xs text-slate-400 hover:text-white">&larr; Back to Public Site</a>
        </div>
        <p class="text-slate-300 mb-6">Private access for confirmed reservation holders.</p>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
            <div class="bg-slate-800/60 p-4 rounded-xl border border-slate-700">
                <span class="text-xs uppercase text-amber-400 font-bold">Wi-Fi Network</span>
                <p class="text-lg font-mono text-white mt-1">Maadi_Nile_5G</p>
            </div>
            <div class="bg-slate-800/60 p-4 rounded-xl border border-slate-700">
                <span class="text-xs uppercase text-amber-400 font-bold">Wi-Fi Password</span>
                <p class="text-lg font-mono text-white mt-1">NileView2026!</p>
            </div>
        </div>

        <button onclick="sessionStorage.removeItem('dashboard_authenticated'); window.location.href='index.html';" class="bg-red-500/20 text-red-400 hover:bg-red-500/30 px-4 py-2 rounded-lg text-sm font-semibold transition-all">
            Log Out Guest Session
        </button>
    </div>
</body>
</html>
